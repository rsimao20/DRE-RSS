name: Pesquisar OutSystems no DRE

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  pesquisar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install feedparser requests beautifulsoup4

      - name: Correr filtro OutSystems
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/filtrar_outsystems.py

      - name: Guardar resultados
        uses: actions/upload-artifact@v4
        with:
          name: resultados-outsystems
          path: data/outsystems_resultados.json